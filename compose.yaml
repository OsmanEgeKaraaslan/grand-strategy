# Local development infrastructure. Start with: docker compose up -d
# Values can be overridden in a local .env file (see .env.example). Never use these in production.
services:
  postgres:
    image: postgres:17-alpine
    container_name: strategy-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strategy}
      POSTGRES_USER: ${POSTGRES_USER:-strategy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strategy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
