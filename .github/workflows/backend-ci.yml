name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The full suite takes ~40 minutes (2026-11-19, Linux, Java 21): the computer-opponent scenario
    # tests play whole campaigns (ComputerCampaignScenariosIT ~11 min, ComputerBehaviourIT ~4 min).
    timeout-minutes: 50
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # PostgreSQL integration tests skip themselves when Docker is missing. Fail loudly here
      # instead, so CI can never pass with the integration suite silently skipped.
      - name: Require Docker for Testcontainers
        run: docker info --format '{{.ServerVersion}}'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test (unit + PostgreSQL integration tests)
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7
