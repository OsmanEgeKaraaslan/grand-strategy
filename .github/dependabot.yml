# Dependabot: security updates for known vulnerabilities plus weekly version updates. Minor and
# patch bumps are grouped per ecosystem so a week produces a few PRs, not dozens. Every PR still
# runs the backend or frontend CI before it can be merged.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /deploy/backup]
    schedule:
      interval: monthly
