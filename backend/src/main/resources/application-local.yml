# Local development. Defaults match compose.yaml at the repository root; override with
# environment variables (see .env.example). These are throwaway local credentials, not secrets.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/strategy}
    username: ${DB_USERNAME:strategy}
    password: ${DB_PASSWORD:strategy}

logging:
  level:
    com.reach.strategy: DEBUG

strategy:
  supabase:
    # Default: Supabase CLI local stack (`supabase start`). Set SUPABASE_URL to use a hosted project.
    url: ${SUPABASE_URL:http://127.0.0.1:54321}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
