# Production (Supabase PostgreSQL behind Caddy). Every connection value must come from the environment:
# DB_URL, DB_USERNAME and DB_PASSWORD have no defaults, so a missing value fails startup.
# Use Supabase's direct or session-mode connection, not the transaction-mode pooler
# (see docs/ARCHITECTURE.md §4.3 and docs/PRODUCTION_READINESS.md).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # Migrations may run with a separate, more privileged role than the application's DML-only one.
    user: ${FLYWAY_USER:${DB_USERNAME}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD}}

server:
  # Behind Caddy: honour X-Forwarded-For/-Proto only from internal (private-network) proxies, so the
  # scheme (HSTS) and client address in logs are right and a client cannot forge them from outside.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:100}
    max-connections: ${SERVER_MAX_CONNECTIONS:2000}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

# SUPABASE_URL and CORS_ALLOWED_ORIGINS (the deployed frontend origin) must be set.
