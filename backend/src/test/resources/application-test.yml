# Integration-test defaults: the Phase 1–9 suites were written for the two-nation map and ruleset
# v5. Phase 10 suites opt into v6 and the Grand Campaign with @TestPropertySource.
strategy:
  ruleset:
    current-version: v5
  world:
    default-map: sundered-reach
  # Computer turns run in the committing request thread, so tests observe them deterministically;
  # the periodic recovery sweep is off (tests call the runner directly).
  ai:
    execution: inline
    recovery-enabled: false
  # The Phase 1–13 suites predate legal acceptance; AccountIT turns the requirement on.
  legal:
    require-acceptance: false
  # Suites replay whole games far faster than people play; RateLimitIT turns the limits on.
  rate-limits:
    enabled: false
